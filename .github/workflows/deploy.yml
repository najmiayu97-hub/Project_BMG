name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # can be run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; the latest run wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive BASE_PATH
        # Project sites are served from /<repo>/; user/organization sites from /.
        # Derived from GITHUB_REPOSITORY so it works for push and manual dispatch alike.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build classic archive (if present)
        # The classic/ folder is intentionally not committed to this repo,
        # so this step is skipped in CI. If classic/ is committed in the future,
        # the archive is built automatically to the classic/ subpath.
        run: |
          if [ -d classic ]; then
            npm run build:classic
          else
            echo "classic/ not found in this repo - skipping"
          fi

      - name: Build main site
        run: npm run build

      - name: SPA fallback for GitHub Pages
        # GitHub Pages serves 404.html for unknown paths;
        # copying index.html keeps deep links (e.g. /Project_BMG/about-us) working.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
