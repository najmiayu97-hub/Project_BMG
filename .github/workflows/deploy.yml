name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deploy Pages dalam satu waktu; run terbaru menang.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Base path situs. Sesuaikan dengan nama repo / lokasi serve:
  # - repo bernama "bmg"        -> /bmg/   (github.io/bmg)
  # - repo "Project_BMG"        -> /Project_BMG/
  # - user site / custom domain -> /
  BASE_PATH: /bmg/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build classic archive (jika ada)
        # Folder classic/ sengaja tidak ikut di-commit ke repo, jadi di CI
        # langkah ini otomatis dilewati. Jika suatu saat classic/ di-commit,
        # arsip otomatis ikut ter-build ke /bmg/classic/.
        run: |
          if [ -d classic ]; then
            npm run build:classic
          else
            echo "classic/ tidak ada di repo — dilewati"
          fi

      - name: Build main
        run: npm run build

      - name: SPA fallback untuk GitHub Pages
        # GitHub Pages menyajikan 404.html untuk path yang tidak dikenal;
        # menyalin index.html membuat deep link (mis. /bmg/about-us) tetap jalan.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
